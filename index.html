<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOOCAP · Brand Deals</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --poll-ms:20000;
    --ink:#0C0F14; --panel:#141922; --panel-2:#1B212C; --raised:#212935;
    --line:#232A36; --line-2:#2D3645;
    --fg:#E7ECF3; --fg-dim:#A4ADBC; --fg-mute:#727C8C;
    --brand:#F5B544; --data:#5BD0C7;
    --red:#F4685E; --green:#5FC97B; --pink:#E6709E; --purple:#B98AE6;
    --r:16px; --r-sm:10px; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 560px at 82% -12%, rgba(245,181,68,.07), transparent 58%),
      radial-gradient(820px 460px at -8% 108%, rgba(91,208,199,.06), transparent 55%),
      var(--ink);
    color:var(--fg); font-family:"Inter",system-ui,sans-serif; font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{color:var(--data)}
  .wrap{max-width:920px; margin:0 auto; padding:30px 24px 60px}
  .head{display:flex; align-items:center; gap:13px; margin-bottom:8px}
  .diamond{width:13px;height:13px;background:var(--brand);transform:rotate(45deg);border-radius:2px;box-shadow:0 0 14px rgba(245,181,68,.55)}
  .head b{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:.14em;font-size:15px}
  .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--fg-dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .live.syncing .dot{background:var(--brand)}
  .live.stale .dot{background:var(--red)}

  .hero{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:34px; letter-spacing:-.02em; margin:6px 0 2px}
  .hero .nm{color:var(--brand)}
  .sub{color:var(--fg-mute); font-size:13.5px; margin-bottom:22px}

  .cycles{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:22px}
  .cycles button{font-family:var(--mono); font-size:11.5px; color:var(--fg-dim); background:var(--panel);
    border:1px solid var(--line); border-radius:99px; padding:6px 13px; cursor:pointer; transition:.15s}
  .cycles button:hover{border-color:var(--line-2)}
  .cycles button.on{color:var(--ink); background:var(--brand); border-color:var(--brand); font-weight:600}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:13px; margin-bottom:26px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:17px 18px}
  .stat .n{font-family:var(--mono); font-weight:700; font-size:28px; letter-spacing:-.02em; line-height:1}
  .stat .l{color:var(--fg-dim); font-size:12px; margin-top:8px}
  .stat.net{background:linear-gradient(180deg,rgba(95,201,123,.10),rgba(95,201,123,.02)); border-color:rgba(95,201,123,.3)}

  .group + .group{margin-top:26px}
  .group-label{font-family:"Space Grotesk",sans-serif; font-weight:600; font-size:11px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--fg-mute); display:flex; align-items:center; gap:10px; margin:0 0 14px}
  .group-label .c{font-family:var(--mono); color:var(--data); font-size:11px}
  .group-label::after{content:"";flex:1;height:1px;background:var(--line)}

  .deal{display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r); padding:15px 18px; margin-bottom:11px}
  .deal .ttl{flex:1; font-weight:600; font-size:14.5px; line-height:1.35}
  .deal .meta{font-family:var(--mono); font-size:11px; color:var(--fg-mute); margin-top:3px}
  .amt{font-family:var(--mono); font-weight:700; font-size:16px; letter-spacing:-.01em; white-space:nowrap}
  .pill{font-size:10px; font-weight:600; padding:3px 9px; border-radius:99px; white-space:nowrap; letter-spacing:.03em}
  .pill.paid{color:var(--green); background:rgba(95,201,123,.14)}
  .pill.due{color:var(--brand); background:rgba(245,181,68,.12)}

  .gate{text-align:center; padding:80px 20px; color:var(--fg-mute); font-family:var(--mono); font-size:13px}
  .foot{margin-top:40px; padding-top:18px; border-top:1px solid var(--line); color:var(--fg-mute);
    font-family:var(--mono); font-size:11px}
  @media(max-width:560px){ .hero{font-size:26px} .stats{grid-template-columns:1fr} }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="diamond"></div><b>NOOCAP</b>
      <div class="live" id="live"><div class="dot"></div><span id="ago">live</span></div>
    </div>
    <div id="content"><div class="gate">Loading your brand deals…</div></div>
    <div class="foot">◆ This is your live brand-deal tracker — bookmark it. It updates on its own.</div>
  </div>

<script>
const POLL=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--poll-ms'))||20000;
const key=new URLSearchParams(location.search).get('k')||new URLSearchParams(location.search).get('key');
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const $=id=>document.getElementById(id);
const fmt=n=>"$"+Math.round(Number(n)||0).toLocaleString();
const fmtDate=iso=>iso?new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric"}):null;
const MIDX={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
const cycleRank=c=>c==="undated"?-1:(MIDX[String(c).slice(0,3).toUpperCase()]||0);

let DATA=null, selCycle="";

function cyclesOf(vids){
  const set=new Set(); let u=false;
  vids.forEach(v=>{ if(v.cycle) set.add(v.cycle); else u=true; });
  const list=[...set].sort((a,b)=>cycleRank(b)-cycleRank(a));
  if(u) list.push("undated");
  return list;
}

function render(){
  const d=DATA; if(!d){return;}
  const vids=d.videos||[];
  const cyc=cyclesOf(vids);
  if(!cyc.includes(selCycle)) selCycle=cyc[0]||"";
  const clabel=selCycle==="undated"?"Undated":(selCycle||"—");
  const inC=v=> selCycle==="undated" ? !v.cycle : v.cycle===selCycle;

  const mine=vids.filter(inC);
  const paid=mine.filter(v=>v.paid);
  const awaiting=mine.filter(v=>!v.paid);
  const gross=paid.reduce((a,v)=>a+(v.amount||0),0);
  const pct=Number(d.cutPct)||0;
  const cut=Math.round(gross*pct/100);
  const net=gross-cut;

  let html="";
  html+=`<div class="hero">Hey <span class="nm">${esc(d.creator)}</span> 👋</div>`;
  html+=`<div class="sub">Every brand deal you've got with NOOCAP, and exactly what you've been paid — updated live.</div>`;

  if(cyc.length){
    html+=`<div class="cycles">`+cyc.map(c=>`<button data-cyc="${esc(c)}" class="${c===selCycle?'on':''}">${c==='undated'?'Undated':esc(c)}</button>`).join("")+`</div>`;
  }

  html+=`<div class="stats">
    <div class="stat"><div class="n" style="color:var(--green)">${fmt(gross)}</div><div class="l">Gross received · ${esc(clabel)}</div></div>
    <div class="stat"><div class="n" style="color:var(--purple)">${fmt(cut)}</div><div class="l">NOOCAP cut · ${pct}%</div></div>
    <div class="stat net"><div class="n" style="color:var(--green)">${fmt(net)}</div><div class="l">Your net take</div></div>
  </div>`;

  if(paid.length){
    html+=`<div class="group"><div class="group-label">Paid <span class="c">${paid.length}</span></div>`;
    html+=paid.map(v=>`<div class="deal"><div class="ttl">${esc(v.title)}<div class="meta">${v.paidDate?('paid '+fmtDate(v.paidDate)):'paid'}</div></div>
      <span class="pill paid">Paid</span><span class="amt" style="color:var(--green)">${fmt(v.amount)}</span></div>`).join("")+`</div>`;
  }

  if(awaiting.length){
    html+=`<div class="group"><div class="group-label">Awaiting payment <span class="c">${awaiting.length}</span></div>`;
    html+=awaiting.map(v=>`<div class="deal"><div class="ttl">${esc(v.title)}<div class="meta">${esc(v.status||'in progress')}</div></div>
      <span class="pill due">Unpaid</span><span class="amt" style="color:${v.amount?'var(--fg)':'var(--fg-mute)'}">${v.amount?fmt(v.amount):'—'}</span></div>`).join("")+`</div>`;
  }

  if(!mine.length){
    html+=`<div class="gate">No brand deals in this cycle yet — they'll show up here as they come in.</div>`;
  }

  $("content").innerHTML=html;
  document.querySelectorAll("[data-cyc]").forEach(b=>b.onclick=()=>{selCycle=b.dataset.cyc;render();});
}

let lastOk=null;
function setLive(s){ $("live").className="live "+s; }
function tickAgo(){ if(!lastOk)return; const s=Math.round((Date.now()-lastOk)/1000);
  $("ago").textContent=s<60?"live · "+s+"s":"live · "+Math.floor(s/60)+"m"; }

async function sync(){
  if(!key){ $("content").innerHTML=`<div class="gate">This link is missing its access key. Check with NOOCAP.</div>`; return; }
  setLive("syncing");
  try{
    const res=await fetch(`/api/client-revenue?k=${encodeURIComponent(key)}`,{cache:"no-store"});
    const data=await res.json();
    if(!res.ok||!data.ok) throw new Error(data.error||"unavailable");
    DATA=data; render();
    lastOk=Date.now(); setLive(""); tickAgo();
  }catch(e){
    setLive("stale");
    if(!DATA) $("content").innerHTML=`<div class="gate">${esc(String(e.message||e))}</div>`;
  }
}
setInterval(tickAgo,1000);
setInterval(sync,POLL);
sync();
</script>
</body>
</html>
